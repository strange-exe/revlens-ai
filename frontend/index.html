<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RevLens AI - AI-powered review intelligence platform for homestay owners. Analyze sentiment, detect themes, and generate smart responses." />
    <meta name="theme-color" content="#155c3d" id="theme-color-meta" />
    <title>RevLens AI - Review Intelligence</title>
    <!-- Custom RevLens favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='9' fill='%2315803d'/%3E%3Cpath d='M10 10h8.5a5.5 5.5 0 0 1 0 11H14l6 5H16l-6-5.3V10Z' fill='white' fill-opacity='.95'/%3E%3Ccircle cx='26' cy='24' r='3.5' fill='%23f5c542'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&family=Syne:wght@400..800&display=swap" rel="stylesheet" />
    <!-- FOUC prevention: apply theme before React mounts -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = stored === 'dark' || (!stored && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.getElementById('theme-color-meta').setAttribute('content', '#0a1f14');
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
