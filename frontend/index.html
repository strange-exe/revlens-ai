<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RevLens AI - AI-powered review intelligence platform for homestay owners. Analyze sentiment, detect themes, and generate smart responses." />
    <meta name="theme-color" content="#f7f6f2" id="theme-color-meta" />
    <title>RevLens AI - Review Intelligence</title>
    <!-- Custom RevLens favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='9' fill='%2309090b'/%3E%3Cpath d='M10 10h8.5a5.5 5.5 0 0 1 0 11H14l6 5H16l-6-5.3V10Z' fill='%238b5cf6' fill-opacity='.95'/%3E%3Ccircle cx='26' cy='24' r='3.5' fill='%2306b6d4'/%3E%3C/svg%3E" />
    <!-- Self-hosted fonts, preloaded: they download alongside the JS and are ready before the app's first
         paint, so text never reflows when they swap in (no third-party font requests either). -->
    <link rel="preload" href="/node_modules/@fontsource-variable/syne/files/syne-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/node_modules/@fontsource-variable/sora/files/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <!-- FOUC prevention: apply theme before React mounts -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = stored === 'dark' || (!stored && prefersDark);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.getElementById('theme-color-meta').setAttribute('content', '#0c0b10');
        }
      })();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
